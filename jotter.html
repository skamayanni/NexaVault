<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="crypto-market-card">

        <div class="crypto-market-header">

            <div>
                <h3>Live Market Overview</h3>
                <p>Real-time cryptocurrency market data</p>
            </div>

            <div class="live-indicator">
                <span class="live-dot"></span>
                LIVE
            </div>

        </div>


        <!-- Market table -->

        <div class="crypto-table-wrapper">

            <div class="crypto-table-head">
                <div>Asset</div>
                <div>Price</div>
                <div>24h Change</div>
                <div>Market Cap</div>
            </div>

            <div id="crypto-market-list">

                <!-- Loading state -->

                <div class="crypto-loading">
                    <div class="crypto-spinner"></div>
                    <span>Loading live market data...</span>
                </div>

            </div>

        </div>

    </div>

    <style>
        /* ==========================================
                           LIVE CRYPTO MARKET
                           ========================================== */

        .crypto-market-card {
            width: 100%;
            padding: 20px;

            background: rgba(255, 255, 255, 0.04);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 16px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);

            overflow: hidden;
        }


        /* ==========================================
                             HEADER
                           ========================================== */

        .crypto-market-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 20px;
        }


        .crypto-market-header h3 {
            margin: 0;

            color: #ffffff;

            font-size: 20px;
            font-weight: 600;
        }


        .crypto-market-header p {
            margin: 5px 0 0;

            color: #8b93a7;

            font-size: 13px;
        }


        /* ==========================================
                          LIVE INDICATOR
                        ========================================== */

        .live-indicator {
            display: flex;

            align-items: center;

            gap: 7px;

            padding: 6px 10px;

            border-radius: 20px;

            background: rgba(34, 197, 94, 0.08);

            color: #22c55e;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 0.5px;
        }


        .live-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 5px rgba(34, 197, 94, 0.7),
                0 0 10px rgba(34, 197, 94, 0.4);

            animation: cryptoLivePulse 1.8s infinite;
        }


        @keyframes cryptoLivePulse {

            0% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.4;
                transform: scale(0.75);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }

        }


        /* ==========================================
                           TABLE
                           ========================================== */

        .crypto-table-wrapper {
            width: 100%;

            overflow-x: auto;
        }


        .crypto-table-head {

            display: grid;

            grid-template-columns:
                minmax(200px, 2fr) minmax(130px, 1fr) minmax(120px, 1fr) minmax(150px, 1fr);

            align-items: center;

            padding: 12px 16px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.06);

            color: #7f879a;

            font-size: 11px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            min-width: 650px;
        }


        /* ==========================================
                            COIN ROW
                           ========================================== */

        .crypto-row {

            display: grid;

            grid-template-columns:
                minmax(200px, 2fr) minmax(130px, 1fr) minmax(120px, 1fr) minmax(150px, 1fr);

            align-items: center;

            padding: 15px 16px;

            min-width: 650px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.04);

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .crypto-row:hover {

            background: rgba(255, 255, 255, 0.035);

        }


        /* ==========================================
                            COIN INFORMATION
                           ========================================== */

        .crypto-asset {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .crypto-logo {

            width: 38px;
            height: 38px;

            border-radius: 50%;

            object-fit: cover;

            flex-shrink: 0;
        }


        .crypto-name {

            display: flex;

            flex-direction: column;

            gap: 3px;
        }


        .crypto-name strong {

            color: #ffffff;

            font-size: 14px;

            font-weight: 600;
        }


        .crypto-symbol {

            color: #737b8f;

            font-size: 11px;

            text-transform: uppercase;
        }


        /* ==========================================
                          PRICE
                           ========================================== */

        .crypto-price {

            color: #ffffff;

            font-size: 14px;

            font-weight: 600;
        }


        /* ==========================================
                           24H CHANGE
                           ========================================== */

        .crypto-change {

            font-size: 13px;

            font-weight: 600;
        }


        .crypto-change.positive {

            color: #22c55e;

        }


        .crypto-change.negative {

            color: #ef4444;

        }


        /* ==========================================
                         MARKET CAP
                          ========================================== */

        .crypto-market-cap {

            color: #a1a8b8;

            font-size: 13px;
        }


        /* ==========================================
                         LOADING
                           ========================================== */

        .crypto-loading {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            height: 180px;

            color: #858da0;

            font-size: 13px;
        }


        .crypto-spinner {

            width: 18px;
            height: 18px;

            border: 2px solid rgba(255, 255, 255, 0.12);

            border-top-color: #ffffff;

            border-radius: 50%;

            animation: cryptoSpin 0.8s linear infinite;
        }


        @keyframes cryptoSpin {

            to {
                transform: rotate(360deg);
            }

        }


        /* ==========================================
                           ERROR
                           ========================================== */

        .crypto-error {

            display: flex;

            align-items: center;
            justify-content: center;

            height: 180px;

            padding: 20px;

            text-align: center;

            color: #ef4444;

            font-size: 13px;
        }


        /* ==========================================
                            MOBILE
                          ========================================== */

        @media (max-width: 768px) {

            .crypto-market-card {

                padding: 15px;

            }

            .crypto-market-header h3 {

                font-size: 18px;

            }

            .crypto-market-header p {

                font-size: 12px;

            }

        }


        @media (max-width: 480px) {

            .crypto-market-card {

                padding: 12px;

            }

            .crypto-market-header {

                align-items: flex-start;

            }

            .crypto-market-header h3 {

                font-size: 17px;

            }

        }
    </style>

    <script>

        const cryptoMarketList =
            document.getElementById("crypto-market-list");


        const cryptoIds = [
            "bitcoin",
            "ethereum",
            "binancecoin",
            "solana",
            "ripple",
            "cardano",
            "dogecoin",
            "avalanche-2"
        ];


        async function loadCryptoMarket() {

            try {

                const url =
                    "https://api.coingecko.com/api/v3/coins/markets" +
                    "?vs_currency=usd" +
                    "&ids=" + cryptoIds.join(",") +
                    "&order=market_cap_desc" +
                    "&per_page=8" +
                    "&page=1" +
                    "&sparkline=false" +
                    "&price_change_percentage=24h";


                const response = await fetch(url);


                if (!response.ok) {

                    throw new Error(
                        "Unable to retrieve market data."
                    );

                }


                const coins = await response.json();


                cryptoMarketList.innerHTML = "";


                coins.forEach(coin => {

                    const change =
                        coin.price_change_percentage_24h;


                    const changeClass =
                        change >= 0
                            ? "positive"
                            : "negative";


                    const changeSymbol =
                        change >= 0
                            ? "+"
                            : "";


                    const formattedPrice =
                        formatCryptoPrice(
                            coin.current_price
                        );


                    const formattedMarketCap =
                        formatMarketCap(
                            coin.market_cap
                        );


                    const row =
                        document.createElement("div");


                    row.className =
                        "crypto-row";


                    row.innerHTML = `

                <div class="crypto-asset">

                    <img
                        class="crypto-logo"
                        src="${coin.image}"
                        alt="${coin.name}"
                    >

                    <div class="crypto-name">

                        <strong>
                            ${coin.name}
                        </strong>

                        <span class="crypto-symbol">
                            ${coin.symbol}
                        </span>

                    </div>

                </div>


                <div class="crypto-price">

                    ${formattedPrice}

                </div>


                <div class="
                    crypto-change
                    ${changeClass}
                ">

                    ${changeSymbol}${change.toFixed(2)}%

                </div>


                <div class="crypto-market-cap">

                    ${formattedMarketCap}

                </div>

            `;


                    cryptoMarketList.appendChild(row);

                });


            } catch (error) {

                console.error(
                    "Crypto market error:",
                    error
                );


                cryptoMarketList.innerHTML = `

            <div class="crypto-error">

                Unable to load live cryptocurrency
                market data. Please refresh the page.

            </div>

        `;

            }

        }


        /* ==========================================
           PRICE FORMAT
        ========================================== */

        function formatCryptoPrice(price) {

            if (price >= 1000) {

                return "$" + price.toLocaleString(
                    "en-US",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );

            }


            if (price >= 1) {

                return "$" + price.toLocaleString(
                    "en-US",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 4
                    }
                );

            }


            return "$" + price.toLocaleString(
                "en-US",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 6
                }
            );

        }


        /* ==========================================
           MARKET CAP FORMAT
        ========================================== */

        function formatMarketCap(value) {

            if (value >= 1e12) {

                return "$" +
                    (value / 1e12).toFixed(2) +
                    "T";

            }


            if (value >= 1e9) {

                return "$" +
                    (value / 1e9).toFixed(2) +
                    "B";

            }


            if (value >= 1e6) {

                return "$" +
                    (value / 1e6).toFixed(2) +
                    "M";

            }


            return "$" +
                value.toLocaleString();

        }


        /* ==========================================
           INITIAL LOAD
        ========================================== */

        loadCryptoMarket();


        /* ==========================================
           REFRESH EVERY 160 SECONDS
        ========================================== */

        setInterval(
            loadCryptoMarket,
            160000
        );

    </script>
</body>

</html>
